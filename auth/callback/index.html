<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <script>(function(){try{var t=localStorage.getItem("aves.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <meta name="robots" content="noindex">
  <title>Вход — Aves</title>
  <style>
    .cb { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .cb .bird { width: 96px; height: 96px; margin: 0 auto 1.5rem; animation: hover 1.6s ease-in-out infinite; }
    .cb h1 { font-family: var(--ff-display); font-weight: 500; font-size: var(--step-3); color: var(--ink); margin: 0 0 .5rem; }
    .cb p { color: var(--muted); margin: 0 0 1.5rem; max-width: 36ch; }
    @keyframes hover { 50% { transform: translateY(-8px); } }
  </style>
</head>
<body>
  <main class="cb">
    <div>
      <span class="bird bird--dove" aria-hidden="true"></span>
      <h1 id="t">Входим…</h1>
      <p id="m">Проверяем подпись Telegram. Если сервер спал, это займёт до минуты.</p>
      <div id="a" hidden><button class="btn btn--solid" type="button" id="retry">Войти ещё раз</button></div>
    </div>
  </main>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/aves.js"></script>
  <script>
    Aves.finishLogin()
      .then(function (to) { location.replace(to); })
      .catch(function (e) {
        document.getElementById("t").textContent = "Не получилось войти";
        document.getElementById("m").textContent = e.message;
        document.getElementById("a").hidden = false;
        document.getElementById("retry").onclick = function () { Aves.startLogin("/app/"); };
      });
  </script>
</body>
</html>
